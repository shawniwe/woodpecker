<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Woodpecker CI with shadcn-vue</title>
  <desc id="desc">Illustrative preview of a dark CI dashboard with a sidebar, repository cards, and pipeline statuses.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#101012"/>
      <stop offset="1" stop-color="#1b1b20"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0v24" fill="none" stroke="#fafafa" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <rect x=".5" y=".5" width="1199" height="479" rx="26" fill="url(#bg)" stroke="#3f3f46"/>
  <rect x="1" y="1" width="1198" height="478" rx="26" fill="url(#grid)"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif">
    <rect x="64" y="91" width="134" height="32" rx="7" fill="#18181b" stroke="#45454d"/>
    <path d="M83 109l7-7m-5 13 10-10" fill="none" stroke="#a7f3d0" stroke-width="1.7" stroke-linecap="round"/>
    <text x="105" y="112" fill="#e4e4e7" font-size="13" font-weight="600">shadcn-vue</text>

    <text x="61" y="196" fill="#fafafa" font-size="66" font-weight="700" letter-spacing="-4">Woodpecker</text>
    <text x="64" y="247" fill="#d4d4d8" font-size="34" font-weight="500" letter-spacing="-1.2">A new UI for your CI</text>
    <text x="66" y="313" fill="#a1a1aa" font-size="19">Repositories, pipelines, and logs</text>
    <text x="66" y="342" fill="#a1a1aa" font-size="19">in one self-hosted dashboard.</text>

    <rect x="521" y="61" width="629" height="358" rx="14" fill="#111113" stroke="#45454d"/>
    <rect x="661" y="70" width="480" height="340" rx="10" fill="#18181b" stroke="#34343a"/>
    <path d="M661 112h480" stroke="#34343a"/>
    <rect x="535" y="83" width="22" height="22" rx="6" fill="#202023" stroke="#45454d"/>
    <path d="M541 94h10m-5-5v10" stroke="#a7f3d0" stroke-linecap="round" stroke-width="1.3"/>
    <text x="564" y="98" fill="#fafafa" font-size="11" font-weight="650">Woodpecker</text>
    <rect x="532" y="128" width="119" height="29" rx="6" fill="#27272a"/>
    <path d="M542 142l5-5 5 5-5 5z" fill="none" stroke="#e4e4e7" stroke-width="1.1"/>
    <text x="560" y="147" fill="#fafafa" font-size="11" font-weight="600">Repositories</text>
    <circle cx="547" cy="174" r="4.5" fill="none" stroke="#a1a1aa" stroke-width="1.2"/>
    <text x="560" y="178" fill="#a1a1aa" font-size="11">Settings</text>
    <path d="M538 381h107" stroke="#34343a"/>
    <text x="540" y="397" fill="#a1a1aa" font-size="10">Documentation</text>

    <rect x="677" y="86" width="13" height="10" rx="1.5" fill="none" stroke="#d4d4d8"/>
    <path d="M682 86v10" stroke="#d4d4d8"/>
    <text x="704" y="96" fill="#d4d4d8" font-size="11">Repositories</text>
    <text x="680" y="146" fill="#fafafa" font-size="22" font-weight="650" letter-spacing="-.5">Repositories</text>
    <rect x="1016" y="127" width="106" height="26" rx="5" fill="#fafafa"/>
    <text x="1026" y="144" fill="#18181b" font-size="10.5" font-weight="650">+ Add repository</text>

    <g stroke="#34343a" fill="#18181b">
      <rect x="680" y="170" width="214" height="96" rx="8"/>
      <rect x="908" y="170" width="214" height="96" rx="8"/>
      <rect x="680" y="279" width="442" height="102" rx="8"/>
    </g>
    <path d="M680 219h214m14 0h214m-442 90h442m-442 34h442" stroke="#34343a"/>
    <g fill="#242427" stroke="#3f3f46">
      <rect x="693" y="182" width="24" height="24" rx="6"/>
      <rect x="921" y="182" width="24" height="24" rx="6"/>
    </g>
    <g fill="none" stroke="#d4d4d8" stroke-width="1.3" stroke-linejoin="round">
      <path d="m699 194 6-6 6 6-6 6z"/>
      <path d="m927 194 6-6 6 6-6 6z"/>
    </g>
    <g fill="#fafafa" font-size="12" font-weight="600">
      <text x="727" y="197">web-console</text>
      <text x="955" y="197">api-service</text>
      <text x="693" y="299">Latest run</text>
    </g>
    <g fill="#a1a1aa" font-size="10">
      <text x="824" y="243">2 min ago</text>
      <text x="1047" y="243">just now</text>
      <text x="1096" y="331" text-anchor="end">12 s</text>
      <text x="1096" y="365" text-anchor="end">28 s</text>
    </g>
    <circle cx="697" cy="239" r="3" fill="#86efac"/>
    <text x="707" y="243" fill="#bbf7d0" font-size="10.5">Success</text>
    <circle cx="925" cy="239" r="3" fill="#93c5fd"/>
    <text x="935" y="243" fill="#bfdbfe" font-size="10.5">Running</text>
    <g fill="#e4e4e7" font-size="11">
      <text x="709" y="331">Verify</text>
      <text x="709" y="365">Build</text>
    </g>
    <path d="m693 327 3 3 5-6m-8 37 3 3 5-6" fill="none" stroke="#86efac" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
